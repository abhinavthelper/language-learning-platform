spring.application.name=languageplatform

# Database connectivity (H2 file database: data survives restarts)
spring.datasource.url=jdbc:h2:file:./data/languageplatform;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Create/update tables automatically from the JPA entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true