<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Learner Dashboard')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar(${user.name})}"></nav>
    <div class="container">
        <h1 class="page-title">Welcome back, <span th:text="${user.name}"></span></h1>
        <p class="page-sub">Pick up where you left off.</p>
        <div class="grid">
            <a class="card" th:href="@{/learner/lessons}">
                <div class="icon">📚</div>
                <h3>Lessons</h3>
                <p>Browse approved lessons and take quizzes</p>
            </a>
            <a class="card" th:href="@{/learner/progress}">
                <div class="icon">📈</div>
                <h3>Progress</h3>
                <p>See your quiz results and feedback</p>
            </a>
            <a class="card" th:href="@{/learner/forum}">
                <div class="icon">💬</div>
                <h3>Interactions</h3>
                <p>Talk with other learners</p>
            </a>
            <a class="card" th:href="@{/learner/profile}">
                <div class="icon">👤</div>
                <h3>Profile</h3>
                <p>Update your details and preference</p>
            </a>
        </div>
    </div>
</body>
</html>
