<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Content Management')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar('Admin')}"></nav>
    <div class="container">
        <a class="back" th:href="@{/admin/dashboard}">← Back to dashboard</a>
        <h1 class="page-title">Content Management</h1>
        <p class="page-sub">Review lessons submitted by instructors.</p>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>Title</th><th>Language</th><th>Difficulty</th>
                        <th>Instructor</th><th>Status</th><th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="l : ${lessons}">
                        <td th:text="${l.id}"></td>
                        <td><b th:text="${l.title}"></b></td>
                        <td><span class="tag" th:text="${l.language}"></span></td>
                        <td th:text="${l.difficulty}"></td>
                        <td th:text="${l.instructorEmail}"></td>
                        <td><span class="pill" th:classappend="${#strings.toLowerCase(l.status)}" th:text="${l.status}"></span></td>
                        <td>
                            <div style="display:flex; gap:8px;">
                                <form th:if="${l.status == 'PENDING'}" th:action="@{/admin/content/approve/{id}(id=${l.id})}" method="post">
                                    <button class="btn" type="submit" style="padding:7px 14px;">Approve</button>
                                </form>
                                <form th:if="${l.status == 'PENDING'}" th:action="@{/admin/content/reject/{id}(id=${l.id})}" method="post">
                                    <button class="btn" type="submit" style="padding:7px 14px; background:var(--danger);">Reject</button>
                                </form>
                                <span th:unless="${l.status == 'PENDING'}" style="color:var(--muted);">Reviewed</span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
