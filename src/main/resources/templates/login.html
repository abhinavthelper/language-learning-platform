<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
    <button id="themeToggle" class="icon-btn theme-float" type="button" title="Switch theme">🌙</button>

    <div class="auth-wrap">
        <div class="auth-card">
            <div class="brand">Lingo<span>Learn</span></div>
            <p class="auth-sub">Sign in to continue learning</p>

            <div class="tabs">
                <button type="button" class="tab active" data-role="LEARNER">Learner</button>
                <button type="button" class="tab" data-role="INSTRUCTOR">Instructor</button>
                <button type="button" class="tab" data-role="ADMIN">Admin</button>
            </div>

            <div class="error-box" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" name="role" id="roleField" value="LEARNER">
                <div class="field">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="field">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Your password" required>
                </div>
                <button type="submit" class="btn full" id="loginBtn">Login as Learner</button>
            </form>

            <div id="googleBox">
                <div class="divider">or</div>
                <button type="button" class="google-btn" disabled title="Coming soon">
                    <span class="g">G</span> Continue with Google
                </button>
                <p class="hint">Google sign-in coming soon</p>
            </div>
        </div>
    </div>

    <script>
        var tabs = document.querySelectorAll('.tab');
        var roleField = document.getElementById('roleField');
        var loginBtn = document.getElementById('loginBtn');
        var googleBox = document.getElementById('googleBox');
        var names = { LEARNER: 'Learner', INSTRUCTOR: 'Instructor', ADMIN: 'Admin' };
        tabs.forEach(function (t) {
            t.addEventListener('click', function () {
                tabs.forEach(function (x) { x.classList.remove('active'); });
                t.classList.add('active');
                var role = t.getAttribute('data-role');
                roleField.value = role;
                loginBtn.textContent = 'Login as ' + names[role];
                googleBox.style.display = role === 'LEARNER' ? 'block' : 'none';
            });
        });
    </script>
</body>
</html>
