<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Create Lesson</title>
    <style>
      input,
      textarea,
      select {
        width: 100%;
        padding: 8px;
        margin: 6px 0 14px;
        box-sizing: border-box;
      }
      button {
        padding: 10px 20px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body style="font-family: Arial; margin: 30px; max-width: 500px">
    <h1>Create Lesson</h1>
    <form th:action="@{/instructor/lessons}" method="post">
      <label>Title</label>
      <input type="text" name="title" required />

      <label>Language</label>
      <input type="text" name="language" required />

      <label>Difficulty</label>
      <select name="difficulty">
        <option>Beginner</option>
        <option>Intermediate</option>
        <option>Advanced</option>
      </select>

      <label>Content</label>
      <textarea name="content" rows="5" required></textarea>

      <label>Quiz question</label>
      <input type="text" name="quizQuestion" required />

      <label>Quiz answer</label>
      <input type="text" name="quizAnswer" required />

      <button type="submit">Submit for approval</button>
    </form>
  </body>
</html>
