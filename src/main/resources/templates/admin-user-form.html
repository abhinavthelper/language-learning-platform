<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add User')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar('Admin')}"></nav>
    <div class="container">
        <a class="back" th:href="@{/admin/users}">← Back to users</a>
        <h1 class="page-title">Add User</h1>
        <p class="page-sub">Create a new account and choose its role.</p>

        <div class="card form-card">
            <form th:action="@{/admin/users/create}" method="post">
                <div class="field"><label>Name</label><input type="text" name="name" required></div>
                <div class="field"><label>Email</label><input type="email" name="email" required></div>
                <div class="field"><label>Password</label><input type="text" name="password" required></div>
                <div class="field"><label>Role</label>
                    <select name="role">
                        <option value="LEARNER">LEARNER</option>
                        <option value="INSTRUCTOR">INSTRUCTOR</option>
                        <option value="ADMIN">ADMIN</option>
                    </select>
                </div>
                <button class="btn" type="submit">Create user</button>
            </form>
        </div>
    </div>
</body>
</html>
