<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Lesson')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar('Learner')}"></nav>
    <div class="container" style="max-width:760px;">
        <a th:href="@{/learner/lessons}">← Back to lessons</a>

        <div style="display:flex; gap:8px; margin:20px 0 10px;">
            <span class="tag" th:text="${lesson.language}"></span>
            <span class="tag" th:text="${lesson.difficulty}"></span>
        </div>
        <h1 class="page-title" th:text="${lesson.title}"></h1>

        <div class="card" style="margin-top:24px;">
            <h3>Lesson</h3>
            <p style="color:var(--text); font-size:1.05rem; margin-top:8px;" th:text="${lesson.content}"></p>
        </div>

        <div class="card" style="margin-top:20px;">
            <h3>Quick quiz</h3>
            <p style="color:var(--text); margin:8px 0 16px;" th:text="${lesson.quizQuestion}"></p>
            <form th:action="@{/learner/lessons/{id}/quiz(id=${lesson.id})}" method="post" style="display:flex; gap:10px;">
                <input type="text" name="answer" placeholder="Your answer" required>
                <button class="btn" type="submit">Check</button>
            </form>
            <p th:if="${result}" style="margin-top:16px; font-weight:700; color:var(--accent);" th:text="${result}"></p>
        </div>
    </div>
</body>
</html>
