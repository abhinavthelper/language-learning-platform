<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lesson</title>
    <style>
        input { padding: 8px; width: 250px; }
        button { padding: 8px 16px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body style="font-family: Arial; margin: 30px;">
    <h1 th:text="${lesson.title}"></h1>
    <p><b th:text="${lesson.language}"></b> | <span th:text="${lesson.difficulty}"></span></p>
    <p th:text="${lesson.content}"></p>

    <h3>Quiz</h3>
    <p th:text="${lesson.quizQuestion}"></p>
    <form th:action="@{/learner/lessons/{id}/quiz(id=${lesson.id})}" method="post">
        <input type="text" name="answer" placeholder="Your answer" required>
        <button type="submit">Check</button>
    </form>
    <p th:if="${result}"><b th:text="${result}"></b></p>

    <br>
    <a th:href="@{/learner/lessons}">Back to lessons</a>
</body>
</html>
