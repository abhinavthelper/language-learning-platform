<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('System Settings')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar('Admin')}"></nav>
    <div class="container">
        <a class="back" th:href="@{/admin/dashboard}">← Back to dashboard</a>
        <h1 class="page-title">System Settings</h1>
        <p class="page-sub">Platform information and configuration.</p>

        <div class="card form-card">
            <div style="display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border);">
                <span style="color:var(--muted);">Platform name</span>
                <b>Language Learning Platform</b>
            </div>
            <div style="display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border);">
                <span style="color:var(--muted);">Version</span>
                <b>1.0.0</b>
            </div>
            <div style="display:flex; justify-content:space-between; padding:12px 0;">
                <span style="color:var(--muted);">Status</span>
                <span class="pill approved">Active</span>
            </div>
            <p style="margin-top:16px; color:var(--muted); font-size:0.9rem;">More configuration options will be available soon.</p>
        </div>
    </div>
</body>
</html>
