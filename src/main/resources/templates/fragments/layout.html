<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Language Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/theme.js}"></script>
</head>
<body>
    <nav th:fragment="navbar(name)" class="navbar">
        <div class="brand">Lingo<span>Learn</span></div>
        <div class="nav-right">
            <span class="nav-user" th:text="${name}">User</span>
            <button id="themeToggle" class="icon-btn" type="button" title="Switch theme">🌙</button>
            <a th:href="@{/logout}" class="nav-link">Logout</a>
        </div>
    </nav>
</body>
</html>
