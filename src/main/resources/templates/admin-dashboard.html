<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Admin Dashboard')}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar(${user.name})}"></nav>
    <div class="container">
        <h1 class="page-title">Admin Console</h1>
        <p class="page-sub">Manage users, content and platform settings.</p>
        <div class="grid">
            <a class="card" th:href="@{/admin/users}">
                <div class="icon">👥</div>
                <h3>User Management</h3>
                <p>Add, view and delete users</p>
            </a>
            <a class="card" th:href="@{/admin/content}">
                <div class="icon">🗂️</div>
                <h3>Content Management</h3>
                <p>Approve or reject instructor lessons</p>
            </a>
            <a class="card" th:href="@{/admin/settings}">
                <div class="icon">⚙️</div>
                <h3>System Settings</h3>
                <p>Platform name, version and status</p>
            </a>
            <a class="card" th:href="@{/admin/activity}">
                <div class="icon">📡</div>
                <h3>Activity Monitoring</h3>
                <p>Latest logins and quiz attempts</p>
            </a>
        </div>
    </div>
</body>

</html>
